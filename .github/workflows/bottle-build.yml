name: Build & publish bottles

on:
  workflow_dispatch:
  # Bottle builds run manually after each rc bump (url+sha256 change).
  # Auto-triggering on Formula/*.rb push caused re-fire on bottle-SHA
  # paste-back commits with nothing useful to do — see v1.0.0-rc.8 cycle.

jobs:
  bottle:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Install with --build-bottle from the canonical tap
        run: |
          # Homebrew/setup-homebrew auto-taps this checkout as
          # ai-project-brain/project-brain (the canonical name derived from
          # the homebrew-project-brain repo). Don't create a second local/tap
          # copy — `brew install --build-bottle` will see the same formula
          # in two taps and fail at the "fix install linkage" step.
          brew tap | grep -q '^ai-project-brain/project-brain$' \
            || brew tap ai-project-brain/project-brain
          brew install --build-bottle --formula \
            ai-project-brain/project-brain/project-brain-mcp

      - name: Bottle the formula
        id: bottle
        run: |
          brew bottle \
            --json \
            --no-rebuild \
            --root-url "https://github.com/ai-project-brain/homebrew-project-brain/releases/download/bottles-rc.9" \
            ai-project-brain/project-brain/project-brain-mcp
          # Captures the brew-emitted .bottle.tar.gz file(s) and the JSON manifest in cwd
          ls -la *.bottle.* *.json 2>/dev/null || true

      - name: Print bottle DSL for formula update
        run: |
          # brew bottle's --json output includes the SHA the formula needs
          for f in *.json; do
            echo "=== bottle JSON: $f ==="
            cat "$f"
          done
          # Or, more directly, emit a usable bottle block:
          for f in *.bottle.tar.gz; do
            SHA=$(shasum -a 256 "$f" | awk '{print $1}')
            echo "BOTTLE_FILE=$f"
            echo "BOTTLE_SHA=$SHA"
          done

      - name: Create or update GitHub Release for bottles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view bottles-rc.9 \
            --repo ai-project-brain/homebrew-project-brain >/dev/null 2>&1 \
            || gh release create bottles-rc.9 \
                 --repo ai-project-brain/homebrew-project-brain \
                 --title "Bottles for v1.0.0-rc.7" \
                 --notes "Pre-compiled Homebrew bottles for project-brain-mcp v1.0.0-rc.7. Auto-published by .github/workflows/bottle-build.yml. macos-14 (Sonoma) and macos-15 (Sequoia) on Apple Silicon."

          # `brew bottle` emits filenames with a double-dash separator
          # (`project-brain-mcp--<ver>.<tag>.bottle.tar.gz`), but brew on
          # download synthesizes the URL with a single-dash separator when
          # `root_url` points at a GitHub Releases bucket. Rename to match
          # before uploading so the download URL resolves to a real asset.
          for f in *--*.bottle.tar.gz; do
            [ -f "$f" ] || continue
            single="${f//--/-}"
            mv "$f" "$single"
          done

          for f in *.bottle.tar.gz; do
            gh release upload bottles-rc.9 "$f" \
              --repo ai-project-brain/homebrew-project-brain \
              --clobber
          done

      - name: Upload bottle artifact for downstream summary
        uses: actions/upload-artifact@v4
        with:
          name: bottle-${{ matrix.os }}
          path: |
            *.bottle.tar.gz
            *.json

  summarize:
    needs: bottle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Emit bottle DSL block for formula paste
        run: |
          echo "## Bottle SHA256 summary (paste into Formula/project-brain-mcp.rb)"
          echo ""
          echo "bottle do"
          echo "  root_url \"https://github.com/ai-project-brain/homebrew-project-brain/releases/download/bottles-rc.9\""
          for d in bottle-macos-*; do
            os="${d#bottle-}"
            for f in "$d"/*.bottle.tar.gz; do
              SHA=$(shasum -a 256 "$f" | awk '{print $1}')
              case "$os" in
                macos-14) MACOS_VER="arm64_sonoma" ;;
                macos-15) MACOS_VER="arm64_sequoia" ;;
                *) MACOS_VER="unknown" ;;
              esac
              echo "  sha256 cellar: :any, $MACOS_VER: \"$SHA\""
            done
          done
          echo "end"
