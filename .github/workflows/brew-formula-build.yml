name: Build & test formula

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Link checkout as tap (idempotent)
        run: |
          # Homebrew/setup-homebrew sometimes already does this, but be
          # explicit: link the checked-out repo into the standard tap
          # location so we can refer to the formula by its real tap-prefixed
          # name (ai-project-brain/project-brain/project-brain-mcp) and
          # avoid dual-tap conflicts.
          tap_dir="$(brew --repository)/Library/Taps/ai-project-brain/homebrew-project-brain"
          if [ ! -d "$tap_dir" ]; then
            mkdir -p "$(dirname "$tap_dir")"
            ln -sf "$GITHUB_WORKSPACE" "$tap_dir"
          fi
          brew tap | grep ai-project-brain/project-brain || brew tap ai-project-brain/project-brain

      - name: Style check (path-based — style still accepts paths)
        run: brew style Formula/project-brain-mcp.rb

      - name: Audit formula (by name)
        run: brew audit --strict --formula ai-project-brain/project-brain/project-brain-mcp

      - name: Install formula
        run: brew install --formula ai-project-brain/project-brain/project-brain-mcp

      - name: Verify binary on PATH
        run: |
          command -v project-brain-mcp
          # The MCP server speaks stdio. With stdin closed it should exit
          # cleanly within a second or two — quick liveness check that does
          # not require a full client handshake. perl alarm avoids depending
          # on GNU coreutils' timeout (not always on PATH as `timeout` on macOS).
          perl -e 'alarm 8; exec "project-brain-mcp" or die "exec failed"' </dev/null || true
          echo "binary launched + exited or timed out cleanly"

      - name: Clone main repo + run smoke test
        run: |
          # Clone the same tag the formula installs from, so the smoke
          # test exercises the matching source. The smoke test runs the
          # server as `python3 -m project_brain_mcp` (see smoke runner
          # source), so the pip-installed wheel below is what's actually
          # being tested for prompt/tool/resource discovery; the brew
          # install above is verified to install cleanly and put the
          # binary on PATH, but its in-process behavior is covered by
          # equivalence with the same source under pip.
          tag="$(awk -F'"' '/^  url /{print $2}' Formula/project-brain-mcp.rb | sed -n 's|.*/refs/tags/\(v[^/]*\)\.tar\.gz|\1|p')"
          echo "Cloning $tag"
          git clone --depth=1 --branch "$tag" \
            https://github.com/ai-project-brain/project-brain.git /tmp/pb
          cd /tmp/pb
          python3 -m pip install --break-system-packages /tmp/pb/mcp
          python3 scripts/smoke_mcp_roundtrip.py
